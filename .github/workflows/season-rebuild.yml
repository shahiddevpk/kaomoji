# Rebuilds the site on demand so the seasonal banner (picked at build time in
# components/kaomoji/seasonal-banner.tsx) switches on its start date.
#
# Setup (one time):
#   1. Vercel project > Settings > Git > Deploy Hooks > create a hook for `main`.
#   2. GitHub repo > Settings > Secrets and variables > Actions > New secret
#      named VERCEL_DEPLOY_HOOK_URL, value = the hook URL.
name: season-rebuild

on:
  # Manual only, to avoid unnecessary builds. Run it from the Actions tab on the
  # days the banner changes (see SEASONS in seasonal-banner.tsx), e.g. Nov 28,
  # Dec 26, Jan 1, Jan 8. The banner uses the build server's date.
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set; see the setup notes at the top of this file."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK_URL")
          echo "Deploy hook responded with HTTP $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
